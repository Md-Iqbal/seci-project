<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f0c430;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8960c;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Sun Logo -->
  <g transform="translate(60, 60)">
    <!-- Rays -->
    <g stroke="#f0c430" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-35" x2="0" y2="-25"/>
      <line x1="0" y1="25" x2="0" y2="35"/>
      <line x1="-35" y1="0" x2="-25" y2="0"/>
      <line x1="25" y1="0" x2="35" y2="0"/>
      <line x1="-25" y1="-25" x2="-18" y2="-18"/>
      <line x1="18" y1="18" x2="25" y2="25"/>
      <line x1="25" y1="-25" x2="18" y2="-18"/>
      <line x1="-25" y1="25" x2="-18" y2="18"/>
    </g>
    
    <!-- Core -->
    <circle cx="0" cy="0" r="20" fill="url(#sunGrad)"/>
    <circle cx="0" cy="0" r="13" fill="#c8960c"/>
    <circle cx="0" cy="0" r="7" fill="#f0c430"/>
  </g>
  
  <!-- Bank Name in Bengali -->
  <text x="130" y="50" font-family="'Nikosh', 'Hind Siliguri', sans-serif" 
        font-size="28" font-weight="700" fill="#c8960c">
    সোনালী ব্যাংক পিএলসি
  </text>
  
  <!-- Tagline -->
  <text x="130" y="75" font-family="'Nikosh', 'Hind Siliguri', sans-serif" 
        font-size="14" font-weight="500" fill="#2d2d44">
    আপনার বিশ্বস্ত আর্থিক সহযোগী
  </text>
  
  <!-- English Name -->
  <text x="130" y="95" font-family="Arial, sans-serif" 
        font-size="12" font-weight="600" fill="#666">
    SONALI BANK PLC
  </text>
</svg>