<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f0c430;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8960c;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d44;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)" stroke="#c8960c" stroke-width="3"/>
  
  <!-- Outer Sun Rays -->
  <g stroke="#f0c430" stroke-width="4" stroke-linecap="round">
    <!-- Main 8 rays -->
    <line x1="100" y1="20" x2="100" y2="35"/>
    <line x1="100" y1="165" x2="100" y2="180"/>
    <line x1="20" y1="100" x2="35" y2="100"/>
    <line x1="165" y1="100" x2="180" y2="100"/>
    <line x1="35" y1="35" x2="45" y2="45"/>
    <line x1="155" y1="155" x2="165" y2="165"/>
    <line x1="165" y1="35" x2="155" y2="45"/>
    <line x1="35" y1="165" x2="45" y2="155"/>
    
    <!-- Intermediate rays -->
    <g opacity="0.7" stroke-width="3">
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(22.5 100 100)"/>
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(45 100 100)"/>
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(67.5 100 100)"/>
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(112.5 100 100)"/>
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(135 100 100)"/>
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(157.5 100 100)"/>
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(202.5 100 100)"/>
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(225 100 100)"/>
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(247.5 100 100)"/>
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(292.5 100 100)"/>
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(315 100 100)"/>
      <line x1="100" y1="22" x2="100" y2="32" transform="rotate(337.5 100 100)"/>
    </g>
  </g>
  
  <!-- Sun Core -->
  <circle cx="100" cy="100" r="45" fill="url(#sunGradient)"/>
  <circle cx="100" cy="100" r="30" fill="#c8960c"/>
  <circle cx="100" cy="100" r="18" fill="#f0c430"/>
  <circle cx="100" cy="100" r="10" fill="#fff8e1"/>
  
  <!-- Shine effect -->
  <ellipse cx="90" cy="85" rx="8" ry="12" fill="#ffffff" opacity="0.3" transform="rotate(-30 90 85)"/>
</svg>