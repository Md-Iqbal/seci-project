{% extends 'base.html' %}
{% load static %}

{% block title %}সকল আবেদন - সোনালী ব্যাংক{% endblock %}

{% block content %}
<h2 class="bn-text mb-4">
    <i class="bi bi-list-ul text-gold"></i> সকল আবেদন
</h2>

<div class="card mb-4 border-gold">
    <div class="card-body">
        <form id="filterForm" class="row g-3">
            <div class="col-md-4">
                <label for="search" class="form-label bn-text">খুঁজুন</label>
                <input type="text" class="form-control" id="search" name="search"
                    placeholder="আবেদন নং, নাম, এনআইডি, মোবাইল, হিসাব নং">
            </div>
            <div class="col-md-3">
                <label for="status" class="form-label bn-text">অবস্থা</label>
                <select class="form-select" id="status" name="status">
                    <option value="">সকল অবস্থা</option>
                    <option value="PENDING">অপেক্ষমাণ</option>
                    <option value="APPROVED">অনুমোদিত</option>
                    <option value="REJECTED">প্রত্যাখ্যাত</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">&nbsp;</label>
                <button type="submit" class="btn btn-primary d-block w-100 bn-text">
                    <i class="bi bi-search"></i> খুঁজুন
                </button>
            </div>
            <div class="col-md-2">
                <label class="form-label">&nbsp;</label>
                <button type="button" class="btn btn-secondary d-block w-100 bn-text" onclick="resetFilters()">
                    <i class="bi bi-arrow-clockwise"></i> রিসেট
                </button>
            </div>
        </form>
    </div>
</div>

<div class="card border-gold shadow-gold">
    <div class="card-body">
        <div id="applicationsContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-gold" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2 bn-text">তথ্য লোড হচ্ছে...</p>
            </div>
        </div>

        <nav id="paginationContainer" class="mt-3"></nav>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/api-handler.js' %}"></script>
<script>
    let currentPage = 1;
    let currentFilters = {};

    async function loadApplications(page = 1) {
        const container = document.getElementById('applicationsContainer');
        showLoading(container);

        try {
            const params = {
                page: page,
                ...currentFilters
            };

            const response = await api.getApplications(params);

            let html = `
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr class="bn-text">
                            <th>আবেদন নং</th>
                            <th>নাম</th>
                            <th>এনআইডি</th>
                            <th>মোবাইল</th>
                            <th>হিসাবের ধরন</th>
                            <th>তারিখ</th>
                            <th>অবস্থা</th>
                            <th>কার্যক্রম</th>
                        </tr>
                    </thead>
                    <tbody class="bn-text">
        `;

            if (response.results.length === 0) {
                html += `
                <tr>
                    <td colspan="8" class="text-center py-4">কোনো আবেদন পাওয়া যায়নি</td>
                </tr>
            `;
            } else {
                response.results.forEach(app => {
                    const statusBadge = getStatusBadgeBengali(app.status);
                    const accountType = getAccountTypeBengali(app.account_type);

                    html += `
                    <tr>
                        <td><code>${app.application_number}</code></td>
                        <td>${app.full_name}</td>
                        <td>${app.nid_number}</td>
                        <td>${app.mobile_number}</td>
                        <td>${accountType}</td>
                        <td>${formatDateBengali(app.application_date)}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <div class="btn-group" role="group">
                                <a href="/applications/${app.application_number}/detail/" 
                                   class="btn btn-sm btn-primary" title="বিস্তারিত">
                                    <i class="bi bi-eye"></i>
                                </a>
                                ${app.status === 'PENDING' ? `
                                <a href="/applications/${app.application_number}/process/" 
                                   class="btn btn-sm btn-success" title="প্রক্রিয়া করুন">
                                    <i class="bi bi-check-circle"></i>
                                </a>
                                ` : ''}
                                <a href="/applications/${app.application_number}/print/" 
                                   class="btn btn-sm btn-info" title="প্রিন্ট" target="_blank">
                                    <i class="bi bi-printer"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                `;
                });
            }

            html += `
                    </tbody>
                </table>
            </div>
        `;

            container.innerHTML = html;
            renderPagination(response);

        } catch (error) {
            showError(container, 'আবেদন লোড করতে সমস্যা হয়েছে');
        }
    }

    function renderPagination(response) {
        const container = document.getElementById('paginationContainer');

        if (!response.next && !response.previous) {
            container.innerHTML = '';
            return;
        }

        let html = '<ul class="pagination justify-content-center">';

        if (response.previous) {
            html += `
            <li class="page-item">
                <a class="page-link bn-text" href="#" onclick="loadApplications(${currentPage - 1}); return false;">
                    পূর্ববর্তী
                </a>
            </li>
        `;
        }

        html += `
        <li class="page-item active">
            <span class="page-link bn-text">পৃষ্ঠা ${toBengaliNumber(currentPage)}</span>
        </li>
    `;

        if (response.next) {
            html += `
            <li class="page-item">
                <a class="page-link bn-text" href="#" onclick="loadApplications(${currentPage + 1}); return false;">
                    পরবর্তী
                </a>
            </li>
        `;
        }

        html += '</ul>';
        container.innerHTML = html;
    }

    function resetFilters() {
        document.getElementById('filterForm').reset();
        currentFilters = {};
        currentPage = 1;
        loadApplications(1);
    }

    document.getElementById('filterForm').addEventListener('submit', function (e) {
        e.preventDefault();

        currentFilters = {};
        const search = document.getElementById('search').value;
        const status = document.getElementById('status').value;

        if (search) currentFilters.search = search;
        if (status) currentFilters.status = status;

        currentPage = 1;
        loadApplications(1);
    });

    function toBengaliNumber(num) {
        const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return num.toString().split('').map(d => bengaliDigits[d] || d).join('');
    }

    function getStatusBadgeBengali(status) {
        const statusMap = {
            'PENDING': '<span class="badge bg-warning">অপেক্ষমাণ</span>',
            'APPROVED': '<span class="badge bg-success">অনুমোদিত</span>',
            'REJECTED': '<span class="badge bg-danger">প্রত্যাখ্যাত</span>'
        };
        return statusMap[status] || status;
    }

    function getAccountTypeBengali(type) {
        const typeMap = {
            'SAVINGS': 'সঞ্চয়ী',
            'CURRENT': 'চলতি',
            'FD': 'স্থায়ী আমানত'
        };
        return typeMap[type] || type;
    }

    function formatDateBengali(dateString) {
        const bengaliMonths = ['জানু', 'ফেব', 'মার্চ', 'এপ্রি', 'মে', 'জুন', 'জুলা', 'আগ', 'সেপ', 'অক্টো', 'নভে', 'ডিসে'];
        const date = new Date(dateString);
        return `${date.getDate()} ${bengaliMonths[date.getMonth()]}, ${date.getFullYear()}`;
    }

    // Load applications on page load
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');

        if (status) {
            document.getElementById('status').value = status;
            currentFilters.status = status;
        }

        loadApplications(1);
    });
</script>
{% endblock %}
