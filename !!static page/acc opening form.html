<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Opening Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-content {
            padding: 40px;
        }

        .section-title {
            background: #f0f4f8;
            padding: 12px 20px;
            margin: 30px -40px 25px -40px;
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            border-left: 4px solid #667eea;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: #2d3748;
            margin-bottom: 8px;
        }

        label .required {
            color: #e53e3e;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-label,
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 400;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .photo-upload {
            border: 2px dashed #cbd5e0;
            border-radius: 6px;
            padding: 30px;
            text-align: center;
            background: #f7fafc;
            transition: all 0.3s;
        }

        .photo-upload:hover {
            border-color: #667eea;
            background: #edf2f7;
        }

        .photo-upload input[type="file"] {
            display: none;
        }

        .upload-btn {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            transition: all 0.3s;
        }

        .upload-btn:hover {
            background: #5568d3;
        }

        .declaration {
            background: #fffaf0;
            border: 1px solid #fbd38d;
            border-radius: 6px;
            padding: 20px;
            margin: 25px 0;
        }

        .declaration label {
            font-weight: 400;
            display: flex;
            align-items: flex-start;
        }

        .declaration input[type="checkbox"] {
            margin-top: 3px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        button {
            padding: 14px 40px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .reset-btn {
            background: #e2e8f0;
            color: #2d3748;
        }

        .reset-btn:hover {
            background: #cbd5e0;
        }

        @media (max-width: 768px) {
            .form-content {
                padding: 20px;
            }

            .section-title {
                margin-left: -20px;
                margin-right: -20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Bank Account Opening Form</h1>
            <p>Please fill in all the required information accurately</p>
        </div>

        <div class="form-content">
            <form id="accountForm">

                <!-- Personal Information -->
                <div class="section-title">Personal Information</div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name <span class="required">*</span></label>
                        <input type="text" name="fullName" required placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label>Date of Birth <span class="required">*</span></label>
                        <input type="date" name="dob" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Gender <span class="required">*</span></label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="gender" value="male" required> Male
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="gender" value="female"> Female
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="gender" value="other"> Other
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Marital Status</label>
                        <select name="maritalStatus">
                            <option value="">Select Status</option>
                            <option value="single">Single</option>
                            <option value="married">Married</option>
                            <option value="divorced">Divorced</option>
                            <option value="widowed">Widowed</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nationality <span class="required">*</span></label>
                        <input type="text" name="nationality" required placeholder="Enter nationality">
                    </div>

                    <div class="form-group">
                        <label>Occupation</label>
                        <input type="text" name="occupation" placeholder="Enter occupation">
                    </div>
                </div>

                <!-- Contact Information -->
                <div class="section-title">Contact Information</div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address <span class="required">*</span></label>
                        <input type="email" name="email" required placeholder="example@email.com">
                    </div>

                    <div class="form-group">
                        <label>Phone Number <span class="required">*</span></label>
                        <input type="tel" name="phone" required placeholder="+1 234 567 8900">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Residential Address <span class="required">*</span></label>
                        <textarea name="address" required placeholder="Enter your complete address"></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>City <span class="required">*</span></label>
                        <input type="text" name="city" required placeholder="Enter city">
                    </div>

                    <div class="form-group">
                        <label>State/Province <span class="required">*</span></label>
                        <input type="text" name="state" required placeholder="Enter state">
                    </div>

                    <div class="form-group">
                        <label>ZIP/Postal Code <span class="required">*</span></label>
                        <input type="text" name="zip" required placeholder="Enter ZIP code">
                    </div>
                </div>

                <!-- Identification Details -->
                <div class="section-title">Identification Details</div>

                <div class="form-row">
                    <div class="form-group">
                        <label>ID Type <span class="required">*</span></label>
                        <select name="idType" required>
                            <option value="">Select ID Type</option>
                            <option value="passport">Passport</option>
                            <option value="driving-license">Driving License</option>
                            <option value="national-id">National ID Card</option>
                            <option value="ssn">Social Security Number</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>ID Number <span class="required">*</span></label>
                        <input type="text" name="idNumber" required placeholder="Enter ID number">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Issue Date</label>
                        <input type="date" name="issueDate">
                    </div>

                    <div class="form-group">
                        <label>Expiry Date</label>
                        <input type="date" name="expiryDate">
                    </div>
                </div>

                <!-- Account Details -->
                <div class="section-title">Account Details</div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Account Type <span class="required">*</span></label>
                        <select name="accountType" required>
                            <option value="">Select Account Type</option>
                            <option value="savings">Savings Account</option>
                            <option value="current">Current Account</option>
                            <option value="fixed-deposit">Fixed Deposit</option>
                            <option value="salary">Salary Account</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Initial Deposit Amount <span class="required">*</span></label>
                        <input type="number" name="deposit" required placeholder="$0.00" min="0" step="0.01">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Purpose of Account</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="purpose" value="personal"> Personal Use
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="purpose" value="business"> Business
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="purpose" value="savings"> Savings
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="purpose" value="investment"> Investment
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Nominee Information -->
                <div class="section-title">Nominee Information (Optional)</div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nominee Name</label>
                        <input type="text" name="nomineeName" placeholder="Enter nominee name">
                    </div>

                    <div class="form-group">
                        <label>Relationship</label>
                        <input type="text" name="relationship" placeholder="e.g., Spouse, Parent">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nominee Phone</label>
                        <input type="tel" name="nomineePhone" placeholder="+1 234 567 8900">
                    </div>

                    <div class="form-group">
                        <label>Nominee Date of Birth</label>
                        <input type="date" name="nomineeDob">
                    </div>
                </div>

                <!-- Document Upload -->
                <div class="section-title">Document Upload</div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Upload Photograph <span class="required">*</span></label>
                        <div class="photo-upload">
                            <input type="file" id="photo" name="photo" accept="image/*" required>
                            <label for="photo" class="upload-btn">Choose Photo</label>
                            <p style="margin-top: 10px; font-size: 13px; color: #718096;">
                                Accepted formats: JPG, PNG (Max 2MB)
                            </p>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Upload ID Document <span class="required">*</span></label>
                        <div class="photo-upload">
                            <input type="file" id="idDocument" name="idDocument" accept=".pdf,.jpg,.png" required>
                            <label for="idDocument" class="upload-btn">Choose Document</label>
                            <p style="margin-top: 10px; font-size: 13px; color: #718096;">
                                Accepted formats: PDF, JPG, PNG (Max 5MB)
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Declaration -->
                <div class="declaration">
                    <label class="checkbox-label">
                        <input type="checkbox" name="declaration" required>
                        <span style="margin-left: 10px;">
                            I hereby declare that the information provided above is true and correct to the best of my
                            knowledge.
                            I agree to the terms and conditions of the bank and authorize the bank to verify the
                            information provided.
                        </span>
                    </label>
                </div>

                <!-- Submit Buttons -->
                <div class="button-group">
                    <button type="submit" class="submit-btn">Submit Application</button>
                    <button type="reset" class="reset-btn">Reset Form</button>
                </div>

            </form>
        </div>
    </div>

    <script>
        document.getElementById('accountForm').addEventListener('submit', function (e) {
            e.preventDefault();

            // Basic validation
            const requiredFields = this.querySelectorAll('[required]');
            let isValid = true;

            requiredFields.forEach(field => {
                if (!field.value) {
                    isValid = false;
                    field.style.borderColor = '#e53e3e';
                } else {
                    field.style.borderColor = '#e2e8f0';
                }
            });

            if (isValid) {
                alert('Form submitted successfully! Your application is being processed.');
                // Here you would normally send the data to a server
                // this.submit();
            } else {
                alert('Please fill in all required fields.');
            }
        });

        // File upload feedback
        document.getElementById('photo').addEventListener('change', function () {
            const fileName = this.files[0]?.name;
            if (fileName) {
                this.nextElementSibling.textContent = fileName;
            }
        });

        document.getElementById('idDocument').addEventListener('change', function () {
            const fileName = this.files[0]?.name;
            if (fileName) {
                this.nextElementSibling.textContent = fileName;
            }
        });
    </script>
</body>

</html>
